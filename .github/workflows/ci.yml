name: Quant-Ichimoku-Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quant-validation-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Causal Ichimoku, Risk Governor & Walk-Forward Tests
        run: |
          python -m unittest discover -s tests -v
